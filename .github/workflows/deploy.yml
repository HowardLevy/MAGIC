name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (leave out source and data files)
        run: |
          mkdir dist
          rsync -a ./ dist/ \
            --exclude '.git' --exclude '.github' --exclude 'dist' \
            --exclude '*.dc.html' --exclude 'magic-data.js' \
            --exclude 'functions' --exclude 'uploads' --exclude '*.txt' --exclude 'github.md' \
            --exclude 'README*' --exclude 'CNAME'

      - name: Create Pages project if it doesn't exist yet
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create magic --production-branch=main

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=magic --branch=main
